name: Nightly sync

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every day
  workflow_dispatch:       # "Run workflow" button for manual runs

concurrency:
  group: nightly-sync
  cancel-in-progress: false

permissions:
  contents: write          # to commit the website data in docs/data

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_DAILY_RESERVE: "200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync API-Football into Supabase
        run: python -m matchvector nightly

      # Runs even if one competition failed above, so the site still gets fresh data
      - name: Export website data
        if: success() || failure()
        run: python -m matchvector export

      - name: Commit website data
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update website data"
          git push

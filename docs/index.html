<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatchVector</title>
<meta name="description" content="Club rankings, projected scores and win/draw/loss chances.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MatchVector">
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --series-blue:    #2a78d6;
    --series-orange:  #eb6834;
    --series-aqua:    #1baf7a;
    --status-good:    #0ca30c;
    --status-critical:#d03b3b;
    --status-warning: #d19d00;
    --chip-bg:        #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --series-blue:    #3987e5;
      --series-orange:  #d95926;
      --series-aqua:    #199e70;
      --status-good:    #0ca30c;
      --status-critical:#e66767;
      --status-warning: #f5c518;
      --chip-bg:        #26261f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --series-blue:    #3987e5;
    --series-orange:  #d95926;
    --series-aqua:    #199e70;
    --status-good:    #0ca30c;
    --status-critical:#e66767;
    --status-warning: #e0b636;
    --chip-bg:        #26261f;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { padding-bottom: env(safe-area-inset-bottom); }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 8px) 14px 8px;
  }
  .app-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header h1 {
    display: inline-flex; align-items: center; gap: 7px; margin: 0;
    font-size: 18px; line-height: 1; font-weight: 800; white-space: nowrap;
  }
  .brand-mark {
    width: 20px; height: 20px; border-radius: 6px;
    background:
      linear-gradient(135deg, var(--series-blue) 0 48%, transparent 48% 52%, var(--series-orange) 52%),
      var(--series-aqua);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22);
  }

  nav.tabs {
    display: flex; gap: 4px; background: var(--chip-bg);
    border-radius: 10px; padding: 3px; margin-bottom: 8px;
  }
  nav.tabs button {
    flex: 1; appearance: none; border: none; background: transparent; cursor: pointer;
    color: var(--text-secondary); font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 4px; border-radius: 8px;
  }
  nav.tabs button[aria-selected="true"] {
    background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 2px var(--border);
  }

  main { padding: 12px 16px 40px; max-width: 720px; margin: 0 auto; }
  .panel { display: none; }
  .panel[data-active="true"] { display: block; }
  .empty-state { text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 16px; }
  .note { color: var(--text-muted); font-size: 12px; padding: 0 0 12px; text-align: center; }

  .filters-wrap { margin-bottom: 10px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-row-more { margin-top: 6px; }
  .filter-row-more[hidden] { display: none; }
  .filter-chip {
    appearance: none; border: 1px solid var(--border); background: var(--chip-bg); cursor: pointer;
    color: var(--text-secondary); font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 20px; white-space: nowrap;
  }
  .filter-chip[aria-pressed="true"] {
    background: color-mix(in srgb, var(--series-blue) 16%, transparent);
    color: var(--series-blue); border-color: transparent;
  }
  .filter-more { color: var(--series-blue); font-weight: 700; }
  .more-country { flex-basis: 100%; font-size: 10px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }

  .secondary-filters { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .date-input {
    appearance: none; border: 1px solid var(--border); background: var(--chip-bg);
    color: var(--text-secondary); font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 20px;
  }
  .nav-btn {
    appearance: none; border: 1px solid var(--border); background: var(--chip-bg); cursor: pointer;
    color: var(--text-secondary); font-family: inherit; font-size: 14px; font-weight: 700;
    width: 28px; height: 28px; border-radius: 50%; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:active, .filter-chip:active { opacity: 0.6; }
  .today-btn { width: auto; border-radius: 20px; padding: 0 10px; font-size: 12px; }

  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .comp-group { margin-top: 16px; }
  .comp-group:first-child { margin-top: 0; }
  .comp-group-header {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.03em;
    padding: 8px 0; margin-bottom: 6px; border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .comp-group-caret { font-size: 10px; width: 10px; color: var(--text-muted); }
  .comp-group-name { margin-right: auto; }
  .comp-group-count { color: var(--text-muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .comp-group.collapsed .card-list { display: none; }
  .comp-group.collapsed .comp-group-header { border-bottom-color: transparent; margin-bottom: 0; }

  .match-card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .match-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .match-meta { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
  .status-tag {
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 6px; border-radius: 6px; background: var(--chip-bg); color: var(--text-secondary);
  }
  .status-tag.live { background: color-mix(in srgb, var(--status-critical) 18%, transparent); color: var(--status-critical); }
  .match-teams { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; gap: 8px; }
  .match-team { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
  .match-team.away { text-align: right; }
  .team-link {
    appearance: none; border: none; background: transparent; padding: 0; cursor: pointer;
    font: inherit; color: inherit; text-align: inherit; overflow-wrap: anywhere;
  }
  .team-link:hover, .team-link:focus-visible { text-decoration: underline; }
  .club-score {
    display: block; width: fit-content; margin-top: 3px; padding: 2px 6px; border-radius: 6px;
    background: color-mix(in srgb, var(--series-blue) 16%, transparent); color: var(--series-blue);
    font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 700;
  }
  .match-team.away .club-score { margin-left: auto; }
  .match-score { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
  .score-row { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .vs-text { color: var(--text-muted); font-size: 12px; font-weight: 600; }
  .proj-box {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; padding: 3px 6px; border-radius: 6px;
    background: color-mix(in srgb, var(--series-blue) 16%, transparent); color: var(--series-blue);
    font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700;
  }
  .final-box {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; padding: 3px 6px; border-radius: 6px;
    background: var(--text-primary); color: var(--page-plane);
    font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 800;
  }
  .score-sub { font-size: 11px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .match-probs { margin-top: 8px; }
  .prob-bar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; }
  .prob-bar span { display: block; height: 100%; border-radius: 2px; }
  .prob-home { background: var(--series-blue); }
  .prob-draw { background: var(--text-muted); }
  .prob-away { background: var(--series-orange); }
  .prob-labels { position: relative; height: 14px; margin-top: 4px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .prob-labels span { position: absolute; top: 0; height: 100%; display: flex; align-items: center; justify-content: center; white-space: nowrap; background: none; }
  .prob-labels .prob-home { color: var(--series-blue); }
  .prob-labels .prob-draw { color: var(--text-muted); }
  .prob-labels .prob-away { color: var(--series-orange); }
  .match-card.rated { cursor: pointer; }
  .market-line { margin-top: 4px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: center; }
  .market-line b { color: var(--text-secondary); font-weight: 700; }
  .vs-market { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .vs-market .hd { color: var(--text-muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; text-align: right; }
  .vs-market .num { text-align: right; font-weight: 700; }
  .vs-market .better { color: var(--status-good); }
  .match-card.acc-5 { background: color-mix(in srgb, var(--status-good) 15%, var(--surface-1)); border-color: #d7a915; border-left: 5px solid #d7a915; }
  .match-card.acc-4 { background: color-mix(in srgb, var(--status-good) 12%, var(--surface-1)); border-left: 4px solid var(--status-good); }
  .match-card.acc-3 { background: color-mix(in srgb, #dfff00 20%, var(--surface-1)); border-left: 4px solid #c4df00; }
  .match-card.acc-2 { background: color-mix(in srgb, var(--series-orange) 12%, var(--surface-1)); border-left: 4px solid var(--series-orange); }
  .match-card.acc-1 { background: color-mix(in srgb, var(--status-critical) 14%, var(--surface-1)); border-left: 5px solid var(--status-critical); }
  .rating-badge { min-width: 30px; padding: 2px 6px; border-radius: 6px; font-size: 10px; line-height: 1.2;
    font-weight: 800; text-align: center; border: 1px solid var(--border); }
  .badge-5 { background: #f6c945; border-color: #b98500; color: #161100; }
  .badge-4 { background: var(--status-good); border-color: var(--status-good); color: #fff; }
  .badge-3 { background: #dfff00; border-color: #a6bd00; color: #101400; }
  .badge-2 { background: var(--series-orange); border-color: var(--series-orange); color: #fff; }
  .badge-1 { background: var(--status-critical); border-color: var(--status-critical); color: #fff; }
  .card-top-right { display: flex; align-items: center; gap: 6px; }
  .rating-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .rating-detail[hidden] { display: none; }
  .factor { background: color-mix(in srgb, var(--surface-1) 70%, var(--chip-bg)); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .factor-name { color: var(--text-muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
  .factor-score { font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .factor-weight { color: var(--text-muted); font-size: 10px; font-weight: 600; }
  .dist-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .dist-label { width: 88px; flex-shrink: 0; font-weight: 700; }
  .dist-bar-wrap { flex: 1; background: var(--chip-bg); border-radius: 4px; height: 10px; overflow: hidden; }
  .dist-bar { height: 100%; border-radius: 4px; }
  .dist-pct { width: 44px; text-align: right; color: var(--text-secondary); font-weight: 600; }

  table.leaderboard { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  table.leaderboard th, table.leaderboard td { padding: 7px 4px; text-align: left; border-bottom: 1px solid var(--gridline); }
  .col-tip { position: fixed; z-index: 50; max-width: 260px; padding: 7px 10px; border-radius: 8px;
    background: var(--text-primary); color: var(--surface-1); font-size: 12px; line-height: 1.4;
    font-weight: 400; text-transform: none; letter-spacing: 0; pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
  .col-tip[hidden] { display: none; }
  .col-tip { white-space: pre-line; }
  td.tip-cell { cursor: help; }
  th[data-tip] { cursor: help; }
  th.sortable[data-tip] { cursor: pointer; }
  table.leaderboard th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-muted);
    font-weight: 600; position: sticky; top: 0; background: var(--page-plane);
  }
  table.leaderboard th.sortable { cursor: pointer; }
  table.leaderboard th.active { color: var(--series-blue); }
  table.leaderboard .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.leaderboard th:first-child, table.leaderboard td:first-child { width: 34px; color: var(--text-muted); }
  table.leaderboard th:nth-child(n+3), table.leaderboard td:nth-child(n+3) { width: 56px; }
  table.leaderboard td:nth-child(2) { overflow-wrap: anywhere; }
  table.leaderboard.clubs th:nth-child(2), table.leaderboard.clubs td:nth-child(2) { width: 32px; padding-left: 2px; padding-right: 2px; }
  table.leaderboard.clubs th:nth-child(3), table.leaderboard.clubs td:nth-child(3) { width: auto; overflow-wrap: anywhere; }
  table.leaderboard.clubs th:nth-child(4), table.leaderboard.clubs td:nth-child(4) { width: 40px; }
  .club-logo { width: 24px; height: 24px; object-fit: contain; display: block; }
  .pl-cell { display: flex; align-items: center; gap: 10px; }
  .pl-cell .pl-badge { flex: none; margin-right: -2px; }
  table.leaderboard.players th.col-season, table.leaderboard.players td.col-season { width: 38px; padding-left: 2px; padding-right: 3px; }
  table.leaderboard.players th.col-season, table.leaderboard.players th[data-sort="rank"] { letter-spacing: 0; line-height: 1.15; }
  table.leaderboard.players td.col-season .rel-chip { min-width: 30px; padding: 2px 2px; font-weight: 700; }
  table.leaderboard.players td.col-season { color: var(--text-secondary); font-size: 12px; }
  table.leaderboard.players th.col-s5, table.leaderboard.players td.col-s5 { padding-left: 12px; width: 46px; }
  /* current season: last column, bold */
  table.leaderboard.players th.col-now { color: var(--text-primary); font-weight: 800; }
  table.leaderboard.players th.col-now, table.leaderboard.players td.col-now { border-left: 1px solid var(--gridline); padding-left: 8px; padding-right: 8px; width: 56px; }
  table.leaderboard.players td.col-now .rel-chip { font-weight: 900; font-size: 12px; min-width: 34px; }
  table.leaderboard.players th.col-age, table.leaderboard.players td.col-age { width: 44px; }
  table.leaderboard.players .dim { color: var(--gridline); }
  /* a season estimated from the age curve (no minutes in covered leagues): outlined, not filled */
  table.season-table .est .rel-chip, table.leaderboard.players .est .rel-chip { background: transparent; box-shadow: inset 0 0 0 1px currentColor; font-style: italic; opacity: .8; }
  @media (max-width: 480px) {
    table.leaderboard.players .col-s3,
    table.leaderboard.players .col-s4, table.leaderboard.players .col-s5 { display: none; }
    table.leaderboard.players th.col-s2, table.leaderboard.players td.col-s2 { padding-left: 8px; width: 42px; }
    .pl-cell { gap: 5px; }
    .pl-cell .pl-badge { width: 16px; height: 16px; margin-right: 0; }
    .pl-cell .player-photo { width: 28px; height: 28px; }
    .pl-cell .pl-nat { display: block; }
    .pl-cell .pl-sep { display: none; }
  }
  .player-photo { width: 32px; height: 32px; flex: none; border-radius: 50%; object-fit: cover; background: var(--chip-bg); }
  table.leaderboard.clubs th:nth-child(6), table.leaderboard.clubs td:nth-child(6) { width: 74px; }
  .table-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border);
    border-radius: 10px; background: var(--surface-1); }
  .table-scroll table.leaderboard th { background: var(--surface-1); z-index: 1; }
  .table-scroll table.leaderboard tbody tr:last-child td { border-bottom: none; }
  .table-scroll table.leaderboard th:first-child, .table-scroll table.leaderboard td:first-child { padding-left: 8px; }
  .table-count { color: var(--text-muted); font-size: 11px; margin: 6px 2px 0; }
  table.leaderboard tbody tr { cursor: pointer; }
  table.leaderboard tbody tr:active { background: var(--chip-bg); }
  .club-meta { color: var(--text-muted); font-size: 11px; margin-left: 6px; white-space: nowrap; }
  .club-sub { display: block; color: var(--text-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .form-up { color: var(--status-good); font-weight: 700; }
  .form-down { color: var(--status-critical); font-weight: 700; }
  .rel-chip { display: inline-block; min-width: 34px; text-align: center; padding: 2px 5px; border-radius: 6px; font-size: 11px; font-weight: 800; }
  .rel-4 { background: color-mix(in srgb, var(--status-good) 18%, transparent); color: var(--status-good); }
  .rel-3 { background: color-mix(in srgb, var(--status-warning) 22%, transparent); color: var(--status-warning); }
  .rel-2 { background: color-mix(in srgb, var(--series-orange) 18%, transparent); color: var(--series-orange); }
  .rel-1 { background: color-mix(in srgb, var(--status-critical) 18%, transparent); color: var(--status-critical); }
  .table-search { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 14px; font-family: inherit; margin-bottom: 10px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex;
    align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal-overlay[hidden] { display: none; }
  .modal-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; max-width: 420px; width: 100%; max-height: 82vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    font-weight: 700; font-size: 15px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .modal-close { appearance: none; border: none; background: transparent; color: var(--text-muted);
    font-size: 22px; line-height: 1; padding: 0 4px; cursor: pointer; }
  .team-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .team-stat { background: var(--chip-bg); border-radius: 8px; padding: 8px; text-align: center; }
  .team-stat-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .team-stat-value { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .modal-section { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 12px 0 4px; }
  .team-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; }
  .team-row + .team-row { border-top: 1px solid var(--border); }
  .team-row-date { width: 58px; flex-shrink: 0; color: var(--text-muted); font-size: 11px; }
  .team-row-opp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-row-res { flex-shrink: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .res-w { color: var(--status-good); } .res-d { color: var(--text-muted); } .res-l { color: var(--status-critical); }

  .range-row { margin-bottom: 8px; }
  .range-row .filter-chip { flex: 1; text-align: center; border-radius: 8px; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }

const decodeEntities = (t) => typeof t === "string" && t.includes("&")
  ? t.replace(/&(apos|#39|quot|amp|lt|gt);/g, (_, e) => ({ apos: "'", "#39": "'", quot: '"', amp: "&", lt: "<", gt: ">" }[e])) : t;
function rowsToObjects(fields, rows) {
  return rows.map((r) => Object.fromEntries(fields.map((f, i) => [f, r[i]])));
}

async function loadData() {
  try {
    const [m, r, st] = await Promise.all([
      fetch("data/matches.json", { cache: "no-store" }).then((res) => res.json()),
      fetch("data/rankings.json", { cache: "no-store" }).then((res) => res.json()),
      fetch("data/stats.json", { cache: "no-store" }).then((res) => res.json()).catch(() => null),
    ]);
    state.stats = st;
    state.bets = await fetch("data/bets.json", { cache: "no-store" }).then((res) => res.json()).catch(() => null);
    const pj = await fetch("data/players.json", { cache: "no-store" }).then((res) => res.json()).catch(() => null);
    if (pj) {        // API-Football sends some names HTML-encoded ("O&apos;Reilly")
      for (const r of pj.players) r[1] = decodeEntities(r[1]);
      for (const xi of Object.values(pj.next_xi || {})) for (const r of xi.players) r[1] = decodeEntities(r[1]);
    }
    state.players = pj ? { list: rowsToObjects(pj.fields, pj.players), nextXi: pj.next_xi, seasons: pj.seasons || [], teams: pj.teams || {} } : null;
    state.data = { ...m, matches: rowsToObjects(m.fields, m.matches) };
    state.rankings = rowsToObjects(r.fields, r.rankings);
    state.rankByTeam = new Map(state.rankings.map((x) => [x.team, x]));
    buildCompetitionLabels();
    if (!state.date) state.date = defaultDate();
    renderFilterChips("match");
    renderTableFilters();
    renderFilterChips("stats");
    renderMatches();
    renderTable();
    renderStats();
    renderBets();
    route();
  } catch (err) {
    console.error(err);
    $("#matches-list").innerHTML = `<div class="empty-state">Couldn't load match data.</div>`;
    $("#table-wrap").innerHTML = `<div class="empty-state">Couldn't load the rankings. Try reloading the page.</div>`;
  }
}

function tableCountries() {
  const present = new Set(state.rankings.map((r) => String(r.league)));
  const byCountry = new Map();
  for (const [id, c] of Object.entries(state.data.competitions)) {
    if (c.type !== "League" || c.country === "World" || !present.has(id)) continue;
    const name = c.country.replace(/-/g, " ");
    if (!byCountry.has(name)) byCountry.set(name, []);
    byCountry.get(name).push(Number(id));
  }
  const rank = (n) => { const i = COUNTRY_FIRST.indexOf(n); return i === -1 ? 99 : i; };
  return [...byCountry.entries()]
    .map(([name, ids]) => ({ name, leagues: ids.sort((a, b) => a - b), region: COUNTRY_FIRST.includes(name) ? null : regionOf(name) }))
    .sort((a, b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name));
}
// League ids for the current filter: null = all
function tableLeagueIds() {
  const f = state.tableFilter;
  if (f === "all") return null;
  if (f.startsWith("c:")) return tableCountries().find((c) => c.name === f.slice(2))?.leagues || [];
  if (f.startsWith("r:")) return tableCountries().filter((c) => c.region === f.slice(2)).flatMap((c) => c.leagues);
  return [Number(f)];
}
function tableFilterIsWide() {   // spans several leagues: show league names and use the scroll box
  const ids = tableLeagueIds();
  return ids === null || ids.length > 1;
}
function renderTableFilters() {
  const wrap = $("#table-filters");
  const f = state.tableFilter;
  const countries = tableCountries();
  const leagueName = (id) => SHORT_NAMES[id] || state.data.competitions[id].name;
  // Clubs (current league members) or ranked players per filter, shown on the right in the side menu
  const counts = new Map();
  let total = 0;
  const players = state.tableView === "players" && state.players;
  for (const r of players ? state.players.list : state.rankings)
    if (players ? playerVisible(r) : r.in_league) { counts.set(r.league, (counts.get(r.league) || 0) + 1); total++; }
  const sum = (ids) => ids.reduce((n, id) => n + (counts.get(id) || 0), 0);
  const countOf = (value) => value === "all" ? total
    : value.startsWith("c:") ? sum(countries.find((c) => c.name === value.slice(2))?.leagues || [])
    : value.startsWith("r:") ? sum(countries.filter((c) => c.region === value.slice(2)).flatMap((c) => c.leagues))
    : counts.get(Number(value)) || 0;
  const chip = (value, label, title, extra = "", cls = "") =>
    `<button type="button" class="filter-chip ${cls}${countOf(value) ? "" : " none"}" data-filter="${escapeHtml(value)}" title="${escapeHtml(title)}" aria-pressed="${f === value}">${extra}<span class="flabel">${label}</span><span class="cnt">${countOf(value)}</span></button>`;
  const caret = `<span class="caret" aria-hidden="true">▾</span>`;
  const list = (html) => `<div class="league-list"><div class="ll-inner">${html}</div></div>`;
  const activeCountry = f.startsWith("c:") ? countries.find((c) => c.name === f.slice(2))
    : countries.find((c) => c.leagues.includes(Number(f)));
  const activeRegion = f.startsWith("r:") ? f.slice(2) : activeCountry?.region;

  // A country: one league = a plain chip; several = a chip that opens its leagues
  const countryGroup = (c) => {
    if (c.leagues.length === 1) return chip(String(c.leagues[0]), escapeHtml(c.name), `${c.name} · ${leagueName(c.leagues[0])}`);
    const inside = c.leagues.includes(Number(f));
    return `<div class="cgroup${activeCountry === c ? " open" : ""}">${chip(`c:${c.name}`, escapeHtml(c.name), `All ${c.name} clubs`, caret, `cchip${inside ? " has-active" : ""}`)}${list(c.leagues.map((id) => chip(String(id), escapeHtml(leagueName(id)), leagueName(id))).join(""))}</div>`;
  };
  const regionGroups = REGIONS.map((region) => {
    const members = countries.filter((c) => c.region === region);
    if (!members.length) return "";
    const inside = activeRegion === region && f !== `r:${region}`;
    return `<div class="cgroup region${activeRegion === region ? " open" : ""}">${chip(`r:${region}`, escapeHtml(region), `All clubs in ${region}`, caret, `cchip${inside ? " has-active" : ""}`)}${list(members.map(countryGroup).join(""))}</div>`;
  });

  // Phones (no hover): rows under the chips with the selected region's countries and country's leagues
  const regionRow = activeRegion ? `<div class="league-row">${countries.filter((c) => c.region === activeRegion)
    .map((c) => chip(c.leagues.length === 1 ? String(c.leagues[0]) : `c:${c.name}`, escapeHtml(c.name), "", "",
      c.leagues.length > 1 && c.leagues.includes(Number(f)) ? "has-active" : "")).join("")}</div>` : "";
  const leagueRow = activeCountry && activeCountry.leagues.length > 1
    ? `<div class="league-row">${activeCountry.leagues.map((id) => chip(String(id), escapeHtml(leagueName(id)), "")).join("")}</div>` : "";
  const scrolled = wrap.querySelector(".cgroups")?.scrollLeft || 0;
  wrap.innerHTML = `<div class="cgroups">
      ${chip("all", "All", "All leagues")}
      <div class="sep"></div>
      ${countries.filter((c) => !c.region).map(countryGroup).join("")}
      <div class="sep"></div>
      ${regionGroups.join("")}
    </div>${regionRow}${leagueRow}`;
  bindFilterHover(wrap);
  // Phones: each chip row swipes sideways; keep the row where it was and the selection in view
  wrap.querySelector(".cgroups").scrollLeft = scrolled;
  for (const row of wrap.querySelectorAll(".cgroups, .league-row")) {
    const on = row.querySelector('[aria-pressed="true"], .has-active');
    if (!on || row.scrollWidth <= row.clientWidth) continue;
    const r = row.getBoundingClientRect(), c = on.getBoundingClientRect();
    if (c.left < r.left + 12) row.scrollLeft += c.left - r.left - 12;
    else if (c.right > r.right - 12) row.scrollLeft += c.right - r.right + 12;
  }
  renderMoreFilters();
}
// Phones: the age, position, club and nationality filters sit behind one button, which

// Side menu (wide screens): a group opens after a short hover, so sweeping the pointer past
// doesn't make the list jump, and closes shortly after the pointer leaves
const SIDE_MENU = matchMedia("(min-width: 1160px)");
function bindFilterHover(wrap) {
  if (!matchMedia("(hover: hover)").matches) return;
  for (const g of wrap.querySelectorAll(".cgroup")) {
    g.addEventListener("mouseenter", () => {
      clearTimeout(g._close);
      g._open = setTimeout(() => g.classList.add("hover-open"), 140);
    });
    g.addEventListener("mouseleave", () => {
      clearTimeout(g._open);
      g._close = setTimeout(() => g.classList.remove("hover-open"), 220);
    });
  }
}
// Update the selection in place: no rebuild, so nothing flickers. A group that was open stays
// open (.stay) until the pointer leaves the menu, so rows don't shift under the pointer.
function syncTableFilters() {
  const wrap = $("#table-filters");
  const f = state.tableFilter;
  const hovering = wrap.matches(":hover");
  wrap.querySelectorAll("[data-filter]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filter === f)));
  for (const g of wrap.querySelectorAll(".cgroup")) {
    const head = g.querySelector(":scope > .filter-chip");
    const pressed = g.querySelector('[aria-pressed="true"]');
    if (g.classList.contains("open") && !pressed && hovering) g.classList.add("stay");
    g.classList.toggle("open", !!pressed);
    head.classList.toggle("has-active", !!pressed && pressed !== head);
  }
}

function renderFilterChips(kind) {
  const wrap = $(`#${kind}-filters`);
  const main = wrap.querySelector(".filter-row");
  const more = wrap.querySelector(".filter-row-more");
  const current = kind === "match" ? state.matchFilter : kind === "stats" ? state.statsFilter : state.tableFilter;
  const matchLike = kind !== "table";
  const chip = (id, label, title = label) =>
    `<button type="button" class="filter-chip" data-filter="${escapeHtml(id)}" title="${escapeHtml(title)}" aria-pressed="${current === id}">${escapeHtml(label)}</button>`;

  const primary = matchLike
    ? [chip("all", "All"), ...PRIMARY_COMPS.map((c) => chip(c.id, c.label, c.ids ? "English teams" : compLabel(c.id)))]
    : [chip("all", "All", "All leagues"), ...TABLE_COMPS.map((c) => chip(c.id, c.label, compLabel(c.id)))];
  const covered = new Set((matchLike ? PRIMARY_COMPS : TABLE_COMPS).map((c) => c.id));

  // "More": every other competition, grouped by country
  const comps = state.data.competitions;
  const present = kind === "match"
    ? new Set(state.data.matches.map((m) => String(m.league)))
    : kind === "stats"
      ? new Set(Object.keys(state.stats?.ranges?.[state.statsRange] || {}))
      : new Set(state.rankings.map((r) => String(r.league)));
  const byCountry = {};
  for (const [id, c] of Object.entries(comps)) {
    if (covered.has(id) || !present.has(id)) continue;
    if (kind === "table" && c.type !== "League") continue;
    (byCountry[c.country] = byCountry[c.country] || []).push(id);
  }
  const countries = Object.keys(byCountry).sort((a, b) =>
    (a === "England" ? -2 : a === "World" ? -1 : 0) - (b === "England" ? -2 : b === "World" ? -1 : 0) || a.localeCompare(b));
  more.innerHTML = countries.map((country) =>
    `<span class="more-country">${escapeHtml(country.replace(/-/g, " "))}</span>` +
    byCountry[country].map((id) => chip(id, SHORT_NAMES[id] || comps[id].name, compLabel(id))).join("")
  ).join("");

  const moreSelected = !covered.has(current) && current !== "all";
  main.innerHTML = primary.join("") +
    `<button type="button" class="filter-chip filter-more" data-more aria-expanded="${moreSelected}" aria-label="More competitions">${moreSelected ? "&#9652;" : "&#9662;"} More</button>`;
  more.hidden = !moreSelected;
}

function onChipClick(kind, e) {
  const moreBtn = e.target.closest("[data-more]");
  const wrap = $(`#${kind}-filters`);
  if (moreBtn) {
    const more = wrap.querySelector(".filter-row-more");
    more.hidden = !more.hidden;
    moreBtn.setAttribute("aria-expanded", String(!more.hidden));
    moreBtn.innerHTML = `${more.hidden ? "&#9662;" : "&#9652;"} More`;
    return;
  }
  const btn = e.target.closest(".filter-chip[data-filter]");
  if (!btn) return;
  if (kind === "match") { state.matchFilter = btn.dataset.filter; renderMatches(); }
  else if (kind === "stats") { state.statsFilter = btn.dataset.filter; renderStats(); }
  else { state.tableFilter = btn.dataset.filter; renderTable(); }
  wrap.querySelectorAll(".filter-chip[data-filter]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.filter === btn.dataset.filter)));
}

// ------------------------------------------------------------------ matches
function rankChip(rank) {
  return Number.isFinite(rank) ? `<span class="club-score" title="Elo rating">${Math.round(rank).toLocaleString()}</span>` : "";
}

function probBar(m) {
  if (m.p_home == null) return "";
  const h = Math.round(m.p_home * 100), d = Math.round(m.p_draw * 100), a = 100 - h - d;
  return `
    <div class="match-probs">
      <div class="prob-bar">
        <span class="prob-home" style="width:${h}%"></span>
        <span class="prob-draw" style="width:${d}%"></span>
        <span class="prob-away" style="width:${a}%"></span>
      </div>
      <div class="prob-labels">
        <span class="prob-home" style="left:0; width:${h}%">${h}%</span>
        <span class="prob-draw" style="left:${h}%; width:${d}%">${d}%</span>
        <span class="prob-away" style="left:${h + d}%; width:${a}%">${a}%</span>
      </div>
    </div>`;
}

function outcome(h, a) { return h > a ? 0 : h === a ? 1 : 2; }

function scoreCentre(m) {
  const finished = FINISHED.has(m.status) && m.hg != null;
  const live = LIVE.has(m.status) && m.hg != null;
  if (finished || live) {
    const pens = m.pen_h != null ? `<div class="score-sub">pens ${m.pen_h}–${m.pen_a}</div>` : "";
    const label = m.source === "backfill" ? "recon" : "proj";
    const tip = m.source === "backfill" ? "Reconstructed afterwards from pre-match data" : "Projected before kickoff";
    const proj = m.home_xg != null ? `<div class="score-sub" title="${tip}">${label} ${m.home_xg.toFixed(1)}–${m.away_xg.toFixed(1)}</div>` : "";
    return `<div class="match-score"><div class="score-row"><span class="final-box">${m.hg}</span><span class="vs-text">–</span><span class="final-box">${m.ag}</span></div>${pens}${proj}</div>`;
  }
  if (m.home_xg == null) return `<div class="match-score"><div class="score-row"><span class="vs-text">vs</span></div></div>`;
  return `<div class="match-score">
      <div class="score-row"><span class="proj-box">${m.home_xg.toFixed(1)}</span><span class="vs-text">vs</span><span class="proj-box">${m.away_xg.toFixed(1)}</span></div>
      ${m.likely ? `<div class="score-sub">likely ${escapeHtml(m.likely)}</div>` : ""}
    </div>`;
}

function statusTag(m) {
  if (LIVE.has(m.status)) return `<span class="status-tag live">Live</span>`;
  if (m.status === "PST") return `<span class="status-tag">Postponed</span>`;
  if (m.status === "CANC" || m.status === "ABD") return `<span class="status-tag">${m.status === "CANC" ? "Cancelled" : "Abandoned"}</span>`;
  if (FINISHED.has(m.status)) return `<span class="status-tag">${m.status === "FT" ? "FT" : m.status}</span>`;
  return "";
}

function matchCard(m) {
  const finished = FINISHED.has(m.status) && m.hg != null;
  const rated = finished && m.rating;
  const cls = rated ? ` rated acc-${m.rating}` : "";
  const badge = rated
    ? `<span class="rating-badge badge-${m.rating}" title="${m.rating}/5 ${RATING_LABELS[m.rating]}">${m.rating}/5</span>` : "";
  const detail = rated ? `<div class="rating-detail" hidden>
      <div class="factor"><span class="factor-name">Overall</span><span class="factor-score">${m.rating}/5 ${RATING_LABELS[m.rating]}</span></div>
      ${FACTORS.map(([k, label, w]) => `<div class="factor"><span class="factor-name">${label} <span class="factor-weight">${w}</span></span><span class="factor-score">${m[k]}/5</span></div>`).join("")}
    </div>` : "";
  const round = m.round ? ` · ${escapeHtml(m.round.replace(/^Regular Season - /, "Round "))}` : "";
  const hRank = finished ? m.home_rank : state.rankByTeam.get(m.home)?.current ?? m.home_rank;
  const aRank = finished ? m.away_rank : state.rankByTeam.get(m.away)?.current ?? m.away_rank;
  return `
    <div class="match-card${cls}">
      <div class="match-card-top">
        <span class="match-meta">${escapeHtml(fmtTime(m.kickoff))}${round}</span>
        <span class="card-top-right">${badge}${statusTag(m)}</span>
      </div>
      <div class="match-teams">
        <div class="match-team">
          ${clubLink(m.home)}
          ${rankChip(hRank)}
        </div>
        ${scoreCentre(m)}
        <div class="match-team away">
          ${clubLink(m.away)}
          ${rankChip(aRank)}
        </div>
      </div>
      ${probBar(m)}
      ${m.p_over25 != null && !(FINISHED.has(m.status) && m.hg != null) ? `<div class="market-line">Over 2.5 goals <b>${Math.round(m.p_over25 * 100)}%</b> · Both teams score <b>${Math.round(m.p_btts * 100)}%</b></div>` : ""}
      ${m.home_xi != null && m.away_xi != null ? `<div class="market-line" title="Average player rank (0-100) of the ${FINISHED.has(m.status) ? "starting" : "predicted"} XI; brackets = average of each side's last 5 starting XIs">${FINISHED.has(m.status) ? "Starting" : "Predicted"} XI rating <b>${Math.round(m.home_xi)}</b>${m.home_recent_xi != null ? ` (${Math.round(m.home_recent_xi)})` : ""} · <b>${Math.round(m.away_xi)}</b>${m.away_recent_xi != null ? ` (${Math.round(m.away_recent_xi)})` : ""}</div>` : ""}
      ${m.home_missing != null || m.away_missing != null ? `<div class="market-line" title="Players listed injured, suspended or doubtful, weighted by their share of their team's recent minutes (1.0 = one ever-present player)">Missing players <b>${(m.home_missing ?? 0).toFixed(1)}</b> · <b>${(m.away_missing ?? 0).toFixed(1)}</b></div>` : ""}
      ${m.m_home != null ? `<div class="market-line" title="Average bookmaker odds, margin removed">Bookmakers <b>${Math.round(m.m_home * 100)}%</b> · <b>${Math.round(m.m_draw * 100)}%</b> · <b>${Math.round(m.m_away * 100)}%</b></div>` : ""}
      ${detail}
    </div>`;
}

function renderMatches() {
  const container = $("#matches-list");
  $("#date-input").value = state.date;
  const ids = idsForFilter(state.matchFilter);
  const day = state.date;
  const shown = state.data.matches
    .filter((m) => !ids || ids.includes(m.league))
    .filter((m) => localDateStr(new Date(m.kickoff)) === day);

  if (!shown.length) {
    const upcoming = state.data.matches
      .filter((m) => (!ids || ids.includes(m.league)) && localDateStr(new Date(m.kickoff)) > day)[0];
    container.innerHTML = `<div class="empty-state">No matches on ${escapeHtml(fmtDay(parseDateInput(day)))}.${upcoming
      ? `<br><br><button type="button" class="filter-chip" data-goto="${localDateStr(new Date(upcoming.kickoff))}">Next: ${escapeHtml(fmtDay(upcoming.kickoff))}</button>` : ""}</div>`;
    return;
  }

  const groups = new Map();
  shown.forEach((m) => { if (!groups.has(m.league)) groups.set(m.league, []); groups.get(m.league).push(m); });
  const orderOf = (id) => { const i = GROUP_ORDER.indexOf(id); return i === -1 ? 999 : i; };
  const ordered = [...groups.keys()].sort((a, b) => orderOf(a) - orderOf(b) || compLabel(a).localeCompare(compLabel(b)));

  container.innerHTML = ordered.map((id) => {
    const list = groups.get(id);
    const collapsed = state.collapsed.has(id);
    return `
      <div class="comp-group${collapsed ? " collapsed" : ""}" data-comp="${id}">
        <div class="comp-group-header">
          <span class="comp-group-caret">${collapsed ? "&#9656;" : "&#9662;"}</span>
          <span class="comp-group-name">${escapeHtml(compLabel(id))}</span>
          <span class="comp-group-count">${list.length}</span>
        </div>
        <div class="card-list">${list.map(matchCard).join("")}</div>
      </div>`;
  }).join("");
}

function stepDate(delta) {
  const d = parseDateInput(state.date);
  d.setDate(d.getDate() + delta);
  state.date = localDateStr(d);
  renderMatches();
}

// ------------------------------------------------------------------ rankings table
function relTier(r) { return r >= 90 ? 4 : r >= 70 ? 3 : r >= 40 ? 2 : 1; }
function formHtml(f) {
  if (f == null) return "";
  const v = Math.round(f);
  return v > 0 ? `<span class="form-up">+${v}</span>` : v < 0 ? `<span class="form-down">${v}</span>` : "0";
}

const POS_LABEL = { G: "GK", D: "DEF", M: "MID", F: "FWD" };
const rankTier = (r) => r >= 80 ? 4 : r >= 60 ? 3 : r >= 35 ? 2 : 1;
function rankChipSmall(r) {
  if (r == null) return "–";
  return `<span class="rel-chip rel-${rankTier(r)}">${Math.round(r)}</span>`;
}

const TOP_ROWS = 10;
// Show the first TOP_ROWS rows; the rest scroll inside the box
// capped=false (a single league) shows every row
// Long lists (All, search): the box fills the rest of the screen - at least TOP_ROWS rows -
// and scrolls inside. A single league shows every row.
function fitTopRows(wrap, capped = true) {
  const box = wrap.querySelector(".table-scroll");
  if (!box) return;
  const rows = box.querySelectorAll("tbody tr");
  if (!capped || rows.length <= TOP_ROWS) { box.style.maxHeight = "none"; return; }
  let minH = box.querySelector("thead").offsetHeight;
  for (let i = 0; i < TOP_ROWS; i++) minH += rows[i].offsetHeight;
  const room = window.innerHeight - box.getBoundingClientRect().top - 12;
  box.style.maxHeight = `${Math.max(minH + 2, room)}px`;
}
window.addEventListener("resize", () => { if (state.rankings && state.tab === "table") fitTopRows($("#table-wrap"), tableFilterIsWide() || !!state.tableSearch.trim()); });

function loadPlayerSeasons() {
  if (state.playerSeasons || state.playerSeasonsLoading) return;
  state.playerSeasonsLoading = fetch("data/player_seasons.json", { cache: "no-store" })
    .then((res) => res.json()).then((d) => { state.playerSeasons = d; }).catch(() => {});
}
// Hover text for a season cell: his age that season (his age now for the current season, one
// less for each season before), then per club "Team – club rank" and
// "minutes – match rating – goals G, assists A"
function playerCellTip(pid, key) {
  const detail = state.playerSeasons;
  if (!detail) return "Loading…";
  const pl = (state.playersById ||= new Map(state.players.list.map((x) => [String(x.id), x]))).get(pid);
  const seasons = state.players.seasons || [];
  const ageLine = pl?.age != null ? `Age ${pl.age - (seasons[0] - Number(key))}
` : "";
  const spells = detail.players?.[pid]?.[key];
  const i = seasons.indexOf(Number(key));
  if (pl?.estimated?.includes(i)) {
    const club = spells?.[0] ? `${detail.teams?.[spells[0][0]] || teamName(spells[0][0])} – ${spells[0][2] ?? "–"}\n` : "";
    return ageLine + club + "Not in a covered league this season\nEstimated from his other seasons and age";
  }
  if (!spells?.length) return ageLine + "No minutes";
  const club = (id) => detail.teams?.[id] || teamName(id);
  return ageLine + spells.map(([team, mins, rank, rating, goals, assists]) =>
    `${club(team)} – ${rank == null ? "–" : rank}\n${mins.toLocaleString()} mins – ${rating == null ? "–" : rating.toFixed(2)} – ${goals ?? 0} G, ${assists ?? 0} A`)
    .join("\n\n");
}

function renderPlayers() {
  const wrap = $("#table-wrap");
  if (!state.players) { wrap.innerHTML = `<div class="empty-state">No player ranks yet.</div>`; return; }
  loadPlayerSeasons();
  const ids = tableLeagueIds();
  const q = state.tableSearch.trim().toLowerCase();
  const all = tableFilterIsWide();
  let rows = q ? state.players.list.filter((p) => p.name.toLowerCase().includes(q) || teamName(p.team).toLowerCase().includes(q))
               : ids === null || state.clubs?.size ? state.players.list : state.players.list.filter((p) => ids.includes(p.league));
  rows = rows.filter(playerVisible);
  // Sort: a season rank ("s2026", the current season by default; highest first) or age
  // (youngest first); blanks last
  const seasons = state.players.seasons || [];
  const groups = selectedGroups();
  const key = state.playerSort === "pos" && !groups.length ? `s${seasons[0]}` : state.playerSort || (groups.length ? "pos" : `s${seasons[0]}`);
  const val = (p) => key === "pos" ? posRank(p, groups) : key.startsWith("s") ? p.seasons?.[seasons.indexOf(Number(key.slice(1)))] : p[key];
  rows = key === "age"
    ? rows.slice().sort((a, b) => (a.age ?? 999) - (b.age ?? 999))
    : rows.slice().sort((a, b) => (val(b) ?? -1) - (val(a) ?? -1));
  const th = (k, label, tip, cls = "") =>
    `<th class="num sortable${key === k ? " active" : ""}${cls}" data-sort="${k}" data-tip="${escapeHtml(tip + " Click to sort.")}">${label}</th>`;
  const seasonName = (y) => `${y}/${String(y + 1).slice(2)}`;
  if (!rows.length) { wrap.innerHTML = `<div class="empty-state">No players match these filters.</div>`; return; }
  wrap.innerHTML = `
    <div class="table-scroll"><table class="leaderboard players">
      <thead><tr>
        <th data-tip="Position in this list, in the current sort order.">#</th>
        <th data-tip="Player, with his club, country and league. Click the club to open its page.">Player</th>
        <th class="num" data-tip="Position: the role he has started in most over his last 20 appearances.">Pos</th>
        ${th("age", "Age", "Age today (sorts youngest first).", " col-age")}
        ${seasons.map((y, i) => [y, i]).reverse().map(([y, i]) => th(`s${y}`, `${String(y).slice(2)}/${String(y + 1).slice(2)}`, `Rank for the ${seasonName(y)} season (the ${y} season in calendar-year leagues such as MLS and Norway${i === 0 ? "; so far" : ""}): his club's level that season, moved by how his stats compare with other players in his position (elite seasons earn extra, and positions are weighted). Squad players who play little are marked down. Every player follows the typical age curve for his position from a level of his own, and only moves off it as far as his minutes that season justify, so a thin season (an injury year, the start of a season) stays close to his curve. A season with no minutes in these leagues is estimated from his other seasons and his age, and shown outlined.`, ` col-season col-s${i}${i === 0 ? " col-now" : ""}`)).join("")}
        ${groups.length ? th("pos", groups.length === 1 ? `As ${groups[0]}` : "In pos", `How good he is now as ${groups.map((g) => GROUP_SINGLE[g]).join(" / ")}: his recent stats scored as that position against its players, with up to 6 points off for a position he hasn't played much (none once it's 40% of his starts). Only positions he has started in get a number. With several positions picked, his best of them.`, " col-posrank") : ""}
      </tr></thead>
      <tbody>${rows.slice(0, FIRST_ROWS).map((p, i) => playerRow(p, i, seasons, groups)).join("")}</tbody>
    </table></div>`;
  fitTopRows(wrap, all || !!q);
  // The rest of the rows go in afterwards in batches, so the first screen (and the age slider)
  // responds at once instead of waiting for thousands of rows; a newer render cancels this one
  const token = state.playerRenderToken = (state.playerRenderToken || 0) + 1;
  const tbody = wrap.querySelector("tbody");
  let at = FIRST_ROWS;
  const more = () => {
    if (token !== state.playerRenderToken || at >= rows.length) return;
    tbody.insertAdjacentHTML("beforeend", rows.slice(at, at + BATCH_ROWS).map((p, j) => playerRow(p, at + j, seasons, groups)).join(""));
    at += BATCH_ROWS;
    setTimeout(more, 0);
  };
  setTimeout(more, 0);
}

const FIRST_ROWS = 100, BATCH_ROWS = 300;
function playerRow(p, i, seasons, groups = selectedGroups()) {
  return `
        <tr${p.team ? ` data-team="${p.team}"` : ""} data-player="${p.id}">
          <td>${i + 1}</td>
          <td><div class="pl-cell">${p.team ? `<img class="club-logo pl-badge" src="${teamLogo(p.team)}" alt="" title="${escapeHtml(teamName(p.team))}" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="club-logo pl-badge"></span>`}<img class="player-photo" src="${playerPhoto(p.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
            <div>${playerLink(p.id, p.name)}<span class="club-sub">${playerClub(p)}${p.nationality ? `<span class="pl-nat"><span class="pl-sep"> · </span>${natLink(p.nationality)}</span>` : ""}</span></div></div></td>
          <td class="num">${POS_LABEL[p.position] || p.position || ""}</td>
          <td class="num col-age">${p.age ?? `<span class="dim">–</span>`}</td>
          ${seasons.map((y, k) => [y, k]).reverse().map(([y, k]) => `<td class="num col-season col-s${k}${k === 0 ? " col-now" : ""} tip-cell" data-key="${y}">${p.seasons?.[k] == null ? `<span class="dim">–</span>` : p.estimated?.includes(k) ? `<span class="est">${rankChipSmall(p.seasons[k])}</span>` : rankChipSmall(p.seasons[k])}</td>`).join("")}
          ${groups.length ? `<td class="num col-posrank">${posRank(p, groups) == null ? `<span class="dim">–</span>` : rankChipSmall(posRank(p, groups))}</td>` : ""}
        </tr>`;
}

function renderTable() {
  if (state.tableView === "players") return renderPlayers();
  const wrap = $("#table-wrap");
  const ids = tableLeagueIds();
  const all = tableFilterIsWide();
  const q = state.tableSearch.trim().toLowerCase();
  const yearAgo = Date.now() - 365 * 864e5;
  // clubs playing in a tracked league this season (drops clubs relegated out of every tracked
  // league and cup-only sides)
  const active = state.rankings.filter((r) => r.in_league);
  let rows = ids === null ? active : active.filter((r) => ids.includes(r.league));
  if (q) rows = state.rankings.filter((r) => teamName(r.team).toLowerCase().includes(q));
  const key = state.tableSort;
  rows = rows.slice().sort((a, b) => (b[key] ?? -1e9) - (a[key] ?? -1e9));
  if (!rows.length) { wrap.innerHTML = `<div class="empty-state">No clubs found.</div>`; return; }
  const th = (k, label, tip) =>
    `<th class="num sortable${key === k ? " active" : ""}" data-sort="${k}" data-tip="${escapeHtml(tip + " Click to sort.")}">${label}</th>`;
  wrap.innerHTML = `
    <div class="table-scroll"><table class="leaderboard clubs">
      <thead><tr>
        <th data-tip="Position in this list, in the current sort order.">#</th>
        <th data-tip="Club badge."></th>
        <th data-tip="Club name, with its country and league. Click a club to open its page.">Club</th>
        ${th("played", "Pl", "Played: matches counted in the Elo rating since 2020, including cups and European games.")}
        ${th("reliability", "Rel", "Reliability, 0 to 100: how far to trust the Elo rating. Lower for clubs with few matches, or whose rating has been swinging a lot.")}
        ${th("lt", "LT Elo", "Long-term Elo rating (LT ALGO): a smoothed rating, weighted mostly to the average over the last 100 matches. Slow to move, and the better guide for matches months away.")}
        ${th("form", "Form", "Elo change over the last 6 matches. Green is rising, red is falling.")}
        ${th("current", "Elo", "Current Elo rating, after the latest match. 100 points is worth a goal a game. It rises when a club does better than expected against that opponent, and falls when it does worse.")}
      </tr></thead>
      <tbody>${rows.map((r, i) => `
        <tr data-team="${r.team}">
          <td>${i + 1}</td>
          <td><img class="club-logo" src="${teamLogo(r.team)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></td>
          <td>${clubLink(r.team)}${q || all ? countryLeague(r.league) : ""}</td>
          <td class="num" style="color:var(--text-muted)">${r.played}</td>
          <td class="num"><span class="rel-chip rel-${relTier(r.reliability)}">${Math.round(r.reliability)}</span></td>
          <td class="num">${Math.round(r.lt)}</td>
          <td class="num">${formHtml(r.form)}</td>
          <td class="num"><b>${Math.round(r.current)}</b></td>
        </tr>`).join("")}
      </tbody>
    </table></div>
`;
  fitTopRows(wrap, all || !!q);
}

// ------------------------------------------------------------------ stats
const pct = (x, d = 1) => `${(100 * x).toFixed(d)}%`;
// ---- Position filter (Players view): a pitch of positions, attacking upwards
const PITCH_SPOTS = [       // [position, x %, y %]
  ["ST", 50, 12],
  ["LW", 18, 25], ["AM", 50, 27], ["RW", 82, 25],
  ["LM", 18, 41], ["CM", 50, 43], ["RM", 82, 41],
  ["LWB", 18, 57], ["DM", 50, 57], ["RWB", 82, 57],
  ["LB", 18, 72], ["CB", 50, 73], ["RB", 82, 72],
  ["GK", 50, 89],
];
const PITCH_LINES = `<svg viewBox="0 0 68 88" preserveAspectRatio="none" aria-hidden="true" fill="none"
    stroke="rgba(255,255,255,0.16)" stroke-width="0.6">
  <rect x="3" y="3" width="62" height="82" rx="1"/><line x1="3" y1="44" x2="65" y2="44"/>
  <circle cx="34" cy="44" r="7"/><rect x="17" y="3" width="34" height="12"/><rect x="26" y="3" width="16" height="5"/>
  <rect x="17" y="73" width="34" height="12"/><rect x="26" y="80" width="16" height="5"/></svg>`;
// A player shows under a position if it's his main one, or he started there for 25%+ of his
// starting minutes in the last 12 months (positions_12m)
const playsAt = (p) => new Set([p.position, ...(p.positions_12m || [])]);
// With the position filter on: the selected role groups, and a player's rank as the best of them
// (position_ranks: his stats scored as each position, less for one he hasn't played)
function selectedGroups() {
  return state.positions?.size ? [...new Set([...state.positions].map((r) => GROUP_OF[r]).filter(Boolean))] : [];
}
function posRank(p, groups) {     // null if he has never played any of them
  const v = groups.map((g) => p.position_ranks?.[g]).filter((x) => x != null);
  return v.length ? Math.max(...v) : null;
}
function playerVisible(p) {
  return inAgeRange(p) && (!state.positions?.size || [...playsAt(p)].some((r) => state.positions.has(r)))
    && (!state.clubs?.size || state.clubs.has(p.team))
    && (!state.nats?.size || state.nats.has(p.nationality));
}
// ---- Club and nationality (Players view): pick one or more of each; they combine with the
// other filters, and a club pick shows that club's players whatever league is selected
function whoOptions() {          // {clubs: label -> team id, nats: sorted names}, built once
  if (!state.whoCache && state.players) {
    const league = new Map(), names = new Map();
    for (const p of state.players.list) if (p.team && !league.has(p.team)) league.set(p.team, p.league);
    for (const t of league.keys()) {
      const n = teamName(t);
      names.set(n, (names.get(n) || 0) + 1);
    }
    const clubs = new Map();
    for (const [t, lg] of league) {
      const n = teamName(t);
      clubs.set(names.get(n) > 1 ? `${n} (${SHORT_NAMES[lg] || state.data.competitions[lg]?.name || lg})` : n, t);

      <span class="dist-bar-wrap"><span class="dist-bar" style="display:block;width:${(v / 5 * 100).toFixed(1)}%;background:var(--series-blue)"></span></span>
      <span class="dist-pct">${v.toFixed(2)}</span></div>`;
  }).join("") : "";
  const ratingBlock = rated ? `
    <div class="stats-card" style="margin-bottom:12px">
      <div class="stats-label">Average rating</div>
      <div class="stats-value">${s.rating_avg.toFixed(2)}<span style="font-size:14px;color:var(--text-muted)"> / 5 · ${RATING_LABELS[avgTier]}</span></div>
      <div style="margin-top:10px">${dist}</div>

      <div style="margin-top:4px">${factorRows}</div>
      <div class="stats-note">Each result is rated 1 (terrible) to 5 (excellent) from five factors, weighted as shown. Tap a result on the Matches tab to see its breakdown.</div>
    </div>` : "";
  const mk = s.market;
  const cmp = (a, b, lowerBetter) => (lowerBetter ? a < b : a > b) ? " better" : "";
  const marketBlock = mk ? `
    <div class="stats-card" style="margin-bottom:12px">
      <div class="stats-label">Model vs bookmakers (${mk.n.toLocaleString()} matches with odds)</div>

        <span></span><span class="hd">Model</span><span class="hd">Bookmakers</span>
        <span>Right result</span><span class="num${cmp(mk.model_correct, mk.market_correct)}">${pct(mk.model_correct)}</span><span class="num${cmp(mk.market_correct, mk.model_correct)}">${pct(mk.market_correct)}</span>
        <span>Log loss</span><span class="num${cmp(mk.model_ll, mk.market_ll, true)}">${mk.model_ll.toFixed(3)}</span><span class="num${cmp(mk.market_ll, mk.model_ll, true)}">${mk.market_ll.toFixed(3)}</span>
      </div>
      <div class="stats-note">Bookmakers' chances are the average across bookmakers with their margin removed, from the last odds before kickoff. Only matches with odds are compared${mk.n < 1000 ? "; the sample is still small, so treat this as a rough guide" : ""}.</div>
    </div>` : `<div class="stats-card" style="margin-bottom:12px"><div class="stats-label">Model vs bookmakers</div><div class="stats-note">No finished matches with bookmaker odds in this range yet. Odds are collected nightly for upcoming matches.</div></div>`;
  body.innerHTML = ratingBlock + marketBlock + `
    <div class="stats-grid">
      ${card("Matches", s.n.toLocaleString(), liveNote)}
      ${card("Right result", pct(s.correct), `Picking the home team every time: ${pct(s.home_rate)}`)}
      ${card("Exact score", pct(s.exact), "Most likely scoreline was spot on")}
      ${card("Goal error", s.goal_error.toFixed(2), "Average goals off per team")}
      ${card("Log loss", s.log_loss.toFixed(3), "Lower is better. Guessing ≈ 1.07")}

    </div>
    <div class="stats-card">
      <div class="stats-label">Calibration: when it says X%, how often did it happen?</div>
      <table class="calib-table">
        <thead><tr><th>Said</th><th>Calls</th><th>Avg said</th><th>Happened</th><th></th></tr></thead>
        <tbody>${rows}</tbody>

// ------------------------------------------------------------------ bets
const MARKET_LABELS = { "1X2": "Result", OU25: "Over/Under 2.5", BTTS: "Both teams score" };
const SEL_LABELS = { Home: "Home win", Draw: "Draw", Away: "Away win", "Over 2.5": "Over 2.5", "Under 2.5": "Under 2.5", Yes: "Both score", No: "Not both score" };

function summarise(bets) {
  const settled = bets.filter((b) => b.result === "win" || b.result === "loss");
  const clvs = settled.map((b) => b.clv).filter((c) => c != null);
  const profit = settled.reduce((a, b) => a + b.profit, 0);
  return {
    placed: bets.length, settled: settled.length, pending: bets.filter((b) => !b.result).length,
    wins: settled.filter((b) => b.result === "win").length, profit,
    roi: settled.length ? profit / settled.length : null,
    avgOdds: settled.length ? settled.reduce((a, b) => a + b.odds, 0) / settled.length : null,
    clv: clvs.length ? clvs.reduce((a, b) => a + b, 0) / clvs.length : null,
    beat: clvs.length ? clvs.filter((c) => c > 0).length / clvs.length : null,
  };
}

function signed(x, d = 1, suffix = "") {
  if (x == null) return "–";
  const cls = x > 0 ? "pos" : x < 0 ? "neg" : "";
  return `<span class="${cls}">${x > 0 ? "+" : ""}${x.toFixed(d)}${suffix}</span>`;
}

function renderBets() {
  const body = $("#bets-body");
  if (!state.bets) { body.innerHTML = `<div class="empty-state">No paper bets yet.</div>`; return; }
  const all = state.bets.bets.filter((b) =>
    (state.betStrategy === "all" || b.strategy === state.betStrategy) &&
    (state.betMarket === "all" || b.market === state.betMarket));
  const s = summarise(all);
  const card = (label, value, note = "") =>
    `<div class="stats-card"><div class="stats-label">${label}</div><div class="stats-value">${value}</div>${note ? `<div class="stats-note">${note}</div>` : ""}</div>`;
  const rules = state.bets.rules;
  const markets = ["1X2", "OU25", "BTTS"].map((mk) => {
    const x = summarise(all.filter((b) => b.market === mk));
    if (!x.placed) return "";
    return `<tr><td>${MARKET_LABELS[mk]}</td><td>${x.settled}</td><td>${signed(x.profit, 1)}</td>
      <td>${x.roi == null ? "–" : signed(100 * x.roi, 1, "%")}</td><td>${x.clv == null ? "–" : signed(100 * x.clv, 1, "%")}</td></tr>`;
  }).join("");
  const row = (b) => {
    const when = new Date(b.kickoff);
    const res = b.result === "win" ? `<span class="pos">Won ${signed(b.profit, 2)}</span>`
      : b.result === "loss" ? `<span class="neg">Lost −1.00</span>`
      : b.result === "void" ? "Void" : "Pending";
    const clv = b.clv != null ? ` · CLV ${signed(100 * b.clv, 1, "%")} (closed ${b.closing_odds?.toFixed(2) ?? "–"})` : "";
    return `<div class="bet-row ${b.result || ""}">
      <div class="bet-top"><span>${escapeHtml(fmtDay(b.kickoff))} ${escapeHtml(fmtTime(b.kickoff))} · ${escapeHtml(compLabel(b.league))}</span><span>${b.strategy === "early" ? "Night before" : "Pre-kickoff"}</span></div>
      <div class="bet-match">${escapeHtml(b.home)} v ${escapeHtml(b.away)}${b.score ? ` <span style="color:var(--text-muted)">(${escapeHtml(b.score)})</span>` : ""}</div>
      <div class="bet-pick"><span>${escapeHtml(SEL_LABELS[b.selection] || b.selection)} @ <b>${b.odds.toFixed(2)}</b> <span style="color:var(--text-muted);font-size:11px">${escapeHtml(b.bookmaker || "")}</span></span><span>${res}</span></div>
      <div class="bet-sub">Model ${Math.round(100 * b.model_prob)}% · bookmakers ${b.fair_prob != null ? Math.round(100 * b.fair_prob) + "%" : "–"} · edge ${signed(100 * b.edge, 1, "%")}${clv}</div>
    </div>`;
  };
  const pending = all.filter((b) => !b.result).sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff));
  const settled = all.filter((b) => b.result);
  body.innerHTML = `
    <div class="stats-grid">
      ${card("Settled bets", s.settled.toLocaleString(), `${s.pending} pending · ${s.wins} won`)}
      ${card("Profit", s.settled ? signed(s.profit, 1) + '<span style="font-size:13px;color:var(--text-muted)"> units</span>' : "–", "1 unit flat stake per bet")}
      ${card("Return (ROI)", s.roi == null ? "–" : signed(100 * s.roi, 1, "%"), s.avgOdds ? `Average odds ${s.avgOdds.toFixed(2)}` : "")}
      ${card("Beat the closing price", s.beat == null ? "–" : pct(s.beat), s.clv == null ? "Needs settled bets" : `Average CLV ${(s.clv > 0 ? "+" : "") + (100 * s.clv).toFixed(1)}%`)}
    </div>
    <div class="stats-card" style="margin-bottom:12px">
      <div class="stats-label">By market</div>
      ${markets ? `<table class="calib-table"><thead><tr><th>Market</th><th>Settled</th><th>Profit</th><th>ROI</th><th>CLV</th></tr></thead><tbody>${markets}</tbody></table>` : `<div class="stats-note">No bets yet.</div>`}
      <div class="stats-note">Paper bets only, no money. The model bets when its chance × the best price across bookmakers is at least ${Math.round(rules.min_edge * 100)}% better than even, at odds up to ${rules.max_odds}. "Beat the closing price" (CLV) is the early sign of a real edge. Profit needs roughly 1,000+ settled bets before it means much.</div>
    </div>
    ${pending.length ? `<div class="modal-section">Upcoming (${pending.length})</div><div class="bets-list">${pending.map(row).join("")}</div>` : ""}
    ${settled.length ? `<div class="modal-section">Settled</div><div class="bets-list">${settled.slice(0, 150).map(row).join("")}</div>` : ""}
    ${!all.length ? `<div class="empty-state">No bets match this filter yet.</div>` : ""}`;
}

// Overview pitch: in each position, the squad's players who can play there (their main position,
// or 2+ full matches' worth of starting minutes there over the last 12 months; until the
// position minutes have loaded, the 25% rule of the position filter), best first by their rank in
// that position, all of them. Keeper at the top, strikers at the bottom (attacking down the
// page, so the left-sided positions are on the right). Laid out as a grid of lines so long lists push the pitch taller
// instead of overlapping.
const DEPTH_MINUTES = 180;
function canPlay(p) {
  const rows = state.playerSeasons?.positions?.[String(p.id)]?.["12m"];
  if (!rows) return playsAt(p);
  return new Set([p.position, ...rows.filter(([r, m]) => r !== "SUB" && m >= DEPTH_MINUTES).map(([r]) => r)]);
}
function depthPitch(teamId) {
  const squad = (state.players?.list || []).filter((p) => p.team === teamId);
  if (!squad.length) return "";
  const rankAt = (p, r) => p.position_ranks?.[GROUP_OF[r]] ?? (GROUP_OF[p.position] === GROUP_OF[r] ? p.rank : null);
  const spots = PITCH_SPOTS.map(([r, x, y]) => {
    const ps = squad.filter((p) => canPlay(p).has(r)).map((p) => ({ p, rank: rankAt(p, r) ?? p.rank }))
      .sort((a, b) => b.rank - a.rank);
    const cell = `grid-row:${y < 20 ? 6 : y < 35 ? 5 : y < 50 ? 4 : y < 65 ? 3 : y < 80 ? 2 : 1};grid-column:${x < 35 ? 3 : x < 65 ? 2 : 1}`;
    if (!ps.length) return `<div class="dp-spot empty" style="${cell}"><span class="dp-pos">${r}</span></div>`;
    return `<div class="dp-spot" style="${cell}">
      <span class="dp-pos">${r}</span>
      ${ps.map(({ p, rank }) => `<a class="dp-row" href="#/player/${p.id}"><span class="dp-name">${escapeHtml(shortName(p.name))}</span>
        <span class="dp-rank t${rankTier(rank)}">${Math.round(rank)}</span></a>`).join("")}
    </div>`;
  }).join("");
  return `<div class="club-section pp-section"><div class="pitch dp-pitch">${PITCH_LINES}${spots}</div></div>`;
}
const shortName = (name) => name.includes(" ") ? name.split(" ").slice(-1)[0] : name;

// The predicted XI on the pitch: each player at his position with his rank. Players on the
// same line are spread evenly across it (two centre-backs, two left wingers ...).
function xiPitch(teamId) {
  const xi = state.players?.nextXi?.[String(teamId)];
  if (!xi?.players.length) return "";
  const spot = Object.fromEntries(PITCH_SPOTS.map(([r, x, y]) => [r, [x, y]]));
  const lines = new Map();                       // y -> players on that line
  for (const pl of xi.players) {
    const [x, y] = spot[pl[2]] || spot.CM;
    const key = y >= 85 ? 89 : y >= 70 ? 72 : y >= 55 ? 57 : y >= 38 ? 42 : y >= 20 ? 26 : 12;
    if (!lines.has(key)) lines.set(key, []);
    lines.get(key).push({ pl, x });
  }
  const spots = [...lines].flatMap(([y, ps]) => {
    ps.sort((a, b) => a.x - b.x);
    const xs = ps.map((p) => p.x);
    // too close together: spread evenly around their middle, 24% apart (less if that won't fit)
    const clash = xs.some((v, i) => i && v - xs[i - 1] < 22);
    const gap = Math.min(24, 72 / Math.max(1, ps.length - 1)), width = gap * (ps.length - 1);
    const from = Math.min(Math.max(xs.reduce((a, v) => a + v, 0) / xs.length - width / 2, 14), 86 - width);
    return ps.map((p, i) => {
      const x = clash ? from + i * gap : p.x;
      const [pid, name, pos, rank] = p.pl;
      const short = shortName(name);
      return `<a class="pp-spot xi-spot rel-${rank != null ? rankTier(rank) : 1}" href="#/player/${pid}" style="left:${x}%;top:${y}%"
          title="${escapeHtml(`${name} · ${pos}${rank != null ? ` · rank ${rank.toFixed(1)}` : ""}`)}">
        <span class="pp-rank">${rank != null ? Math.round(rank) : "–"}</span><span class="pp-name">${escapeHtml(short)}</span></a>`;
    });
  }).join("");
  const avg = xi.players.filter((p) => p[3] != null);
  return `<div class="club-section pp-section"><div class="pitch pp-pitch">${PITCH_LINES}${spots}</div>
    <div class="page-note" style="text-align:center">Predicted XI${avg.length ? ` · average rank ${Math.round(avg.reduce((a, p) => a + p[3], 0) / avg.length)}` : ""}</div></div>`;
}
